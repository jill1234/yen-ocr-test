<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="日幣掃描測試"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>日幣 OCR 測試 V0.1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#344a3c;background:#f5f1e9}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:650px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}h1{font-size:19px;margin:0}small,.muted{color:#718074}.camera{position:relative;background:#18221d;border-radius:17px;overflow:hidden;aspect-ratio:3/4}video{width:100%;height:100%;object-fit:cover}.scan{position:absolute;left:15%;top:30%;width:70%;height:40%;border:3px solid #a5e0b1;border-radius:12px;box-shadow:0 0 0 100vmax #0003;pointer-events:none}.scan:after{content:'將價格放在框內';position:absolute;bottom:7px;left:0;right:0;text-align:center;color:white;text-shadow:0 1px 4px #000;font-size:13px}.pill{position:absolute;top:12px;left:12px;background:#f7fff0e8;border-radius:30px;padding:7px 10px;font-size:12px}.panel{background:#fff;border-radius:16px;padding:17px;margin-top:12px}.price{font-size:42px;font-weight:750;text-align:center;margin:12px 0;color:#3d7351}.status{font-size:13px;text-align:center;min-height:36px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{background:#537d60;color:white;border:0;border-radius:12px;padding:13px 8px;font-size:15px;font-weight:600}button.secondary{background:#e8efe8;color:#34533c}button:disabled{opacity:.45}label{font-size:14px}select,input{width:100%;font-size:16px;border:1px solid #bdc9bf;border-radius:9px;padding:10px;background:white;margin-top:5px}details{margin-top:14px;background:white;border-radius:14px;padding:14px}summary{font-weight:600;cursor:pointer}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}.row>*{flex:1}.candidate{background:#edf3ed;color:#36513d;padding:8px 12px;margin:4px;border-radius:10px}.candidate.active{background:#537d60;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:140px;overflow:auto;background:#f3f5f2;padding:10px;border-radius:9px}footer{font-size:12px;line-height:1.5;color:#6a776c;padding:15px 3px 35px}.hidden{display:none}</style></head><body><header><div><h1>日幣掃描｜OCR 測試</h1><small>階段 1 · V0.1 · 僅辨識日幣</small></div><span id="network" class="muted">檢查網路中</span></header><div class="camera"><video id="video" autoplay playsinline muted></video><div class="scan"></div><span id="cameraBadge" class="pill">相機尚未啟動</span></div><section class="panel"><div class="muted" style="text-align:center;font-size:13px">目前辨識日幣</div><div id="price" class="price">¥ —</div><div id="status" class="status">請先按「開啟相機」，再載入 OCR 模型。</div><div id="candidates" style="text-align:center"></div><div class="buttons"><button id="start">開啟相機</button><button id="ocr" class="secondary">載入 OCR 模型</button><button id="scan" disabled>開始掃描</button><button id="lock" class="secondary" disabled>鎖定價格</button></div></section><details><summary>測試設定與紀錄</summary><div class="row"><label>辨識語言<select id="language"><option value="jpn+eng">日文＋英文</option><option value="eng">英文／數字（較輕量）</option></select></label><label>掃描間隔<select id="interval"><option value="800">800 毫秒</option><option value="1200">1,200 毫秒</option><option value="1800">1,800 毫秒</option></select></label></div><div class="row"><label><input id="tax" type="checkbox" checked style="width:auto"> 含稅價優先</label><label><input id="stability" type="checkbox" checked style="width:auto"> 連續兩次確認</label></div><div class="row"><button class="secondary" id="clear">清除測試紀錄</button><button class="secondary" id="export">匯出測試 CSV</button></div><p class="muted" id="stats" style="font-size:13px">辨識次數：0</p><pre id="raw">尚無辨識文字</pre><p class="muted" style="font-size:12px">測試紀錄僅暫存在本頁記憶體，關閉頁面後不保留。匯出 CSV 才會產生檔案。</p></details><footer>本版不計算台幣，不傳送相機影像至伺服器。首次載入 OCR 需要網路下載模型；離線能否重新啟動，需在模型下載成功後實測。請勿將價格辨識結果當成付款金額。</footer><canvas id="canvas" class="hidden"></canvas><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
